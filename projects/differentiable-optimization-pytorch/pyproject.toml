[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "differentiable-optimization-pytorch"
version = "0.1.0"
description = "Tutorial-oriented differentiable quadratic optimization with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
constrained = [
    "cvxpy>=1.5",
    "cvxpylayers>=0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
