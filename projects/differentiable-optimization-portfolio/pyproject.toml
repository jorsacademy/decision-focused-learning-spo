[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "differentiable-optimization-portfolio"
version = "0.1.0"
description = "Differentiable convex portfolio optimization layer with end-to-end learning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm Noncommercial 1.0.0"}
dependencies = ["numpy>=1.26", "torch>=2.2", "cvxpy>=1.5", "cvxpylayers>=0.1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
